[metadata]
name = student-logger
version = 0.1.0
author = Your Name
author_email = you@example.com
description = Simple logger helper for student management apps (console + file)
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/student-logger
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
install_requires = 
    loguru>=0.5.3

[options.packages.find]
where = .
